# Conductor CI: the same checks a careful maintainer runs by hand, so a forgotten manual
# run can no longer ship a silently truncated core or a broken installer.
#
# Both OSes matter: the shipped shell layer targets Git Bash on Windows AND stock bash on
# Linux/macOS, and this repo has already met one bug (a locale-dependent grep class) that
# only one of the two environments could catch.
name: ci

# Every pushed branch is checked, not only main: the Windows half of this suite cannot run on
# a developer's Linux or cloud session, and without this the only way to see it before main
# was to open a pull request or to ask a person to test by hand.
on:
  push:
  pull_request:

# A newer push to the same working branch makes the older run pointless (the Windows job
# takes about a quarter of an hour). Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    # A pull request from a branch of this repository was already checked by its push; only
    # a pull request from a fork needs a run of its own.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax (bash -n) on every script
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' f; do
              bash -n "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
            done

      - name: Lint (default locale)
        run: bash qa/lint.sh

      - name: Lint (C locale - guards locale-dependent regressions)
        run: LC_ALL=C bash qa/lint.sh

      - name: Lint negative self-test (every guard must actually fire)
        run: bash qa/lint-selftest.sh

      - name: Warning guard self-test (a check that prints a warning must fail)
        run: bash qa/no-warnings-test.sh

      - name: settings-json compile + tests (highest blast-radius code)
        run: |
          python -m py_compile tools/settings-json.py
          bash qa/no-warnings.sh python qa/settings-json-test.py

      - name: Trust-path behavior self-tests
        run: |
          bash qa/no-warnings.sh python -B qa/companions-test.py
          bash qa/no-warnings.sh python -B -m unittest discover -s qa/companions -v
          bash qa/no-warnings.sh python -B -m unittest discover -s qa/project_artifacts -v
          bash qa/no-warnings.sh bash qa/uninstall-test.sh
          bash qa/no-warnings.sh bash qa/doctor-test.sh
          bash qa/no-warnings.sh bash qa/payload-test.sh
          bash qa/no-warnings.sh bash qa/journal-report-test.sh
          bash qa/no-warnings.sh python -B qa/test-run-journal-test.py
          bash qa/no-warnings.sh python -B qa/memory-test.py
          bash qa/no-warnings.sh python -B qa/edits-test.py
          bash qa/no-warnings.sh python -B qa/falsify-test.py
          bash qa/no-warnings.sh python -B -m unittest discover -s qa/session_env -v
          bash qa/no-warnings.sh python -B qa/lesson-recall-test.py
          bash qa/no-warnings.sh python -B qa/memory-restore-test.py
          bash qa/no-warnings.sh python -B qa/safe-undo-test.py
          bash qa/no-warnings.sh python -B qa/cloud-update-test.py
          bash qa/no-warnings.sh bash qa/bench-selftest.sh

      - name: Per-project verification evidence
        run: bash qa/no-warnings.sh python -B -m unittest discover -s qa/evidence -v

      - name: Recoverable CLI updates
        run: bash qa/no-warnings.sh python -B -m unittest discover -s qa/updater -v

      - name: Unified first install and GitHub bootstrap
        run: bash qa/no-warnings.sh python -B -m unittest discover -s qa/bootstrap -v

      - name: Graphify semantic update guard
        run: bash qa/no-warnings.sh python -B qa/graphify-check-test.py -v

      - name: Recoverable Graphify update (real engine and fault injection)
        env:
          PYTHONHASHSEED: '0'
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install 'graphifyy==0.9.67'
          bash qa/no-warnings.sh python -B -m unittest discover -s qa/graph_refresh -v

      - name: Sandbox install smoke test (never touches the runner's real config)
        run: |
          SB="$(mktemp -d)"
          mkdir -p "$SB/bin"
          printf '#!/usr/bin/env bash\nexit 1\n' > "$SB/bin/claude"
          chmod +x "$SB/bin/claude"
          HOME="$SB/home" CLAUDE_CONFIG_DIR="$SB/home/.claude" PATH="$SB/bin:$PATH" \
            bash install.sh --language English --skip-companions </dev/null
          HOME="$SB/home" CLAUDE_CONFIG_DIR="$SB/home/.claude" \
            bash qa/no-warnings.sh bash tools/doctor.sh
          grep -q 'Answer in English' "$SB/home/.claude/CLAUDE.md"

      - name: Shellcheck (errors only; ubuntu ships it preinstalled)
        if: matrix.os == 'ubuntu-latest'
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 shellcheck --severity=error
